name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java 26
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon
